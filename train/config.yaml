# FLUX Training Configuration
# This file contains all the configuration parameters for FLUX model training

# Random seed for reproducibility
seed: 42

# Dataset configuration
dataset:
  train_batch_size: 16 # Reduced from 8 to 2 to help with memory
  eval_batch_size: 16   # Reduced from 8 to 2 to help with memory
  num_workers: 24       # Reduced from 16 to 8 to help with memory
  # Separate paths for different data splits
  train_datadir: "/data0/teja_works/diffusion_training/nvidia_tools_training/mosicml_code/FlowModelTraining/data_gen/dataset_output/mds/val_data"
  eval_datadir: "/data0/teja_works/diffusion_training/nvidia_tools_training/mosicml_code/FlowModelTraining/data_gen/dataset_output/mds/val_data"
  test_datadir: "/data0/teja_works/diffusion_training/nvidia_tools_training/mosicml_code/FlowModelTraining/data_gen/dataset_output/mds/val_data"
  # Note: Dataset limitation removed to avoid DataLoader issues
  # Enable/disable test dataloader creation
  create_test_loader: false

# Model configuration
model:
  name: "flux-schnell"  # Model variant to load
  dtype: "bfloat16"     # Data type for training (bfloat16 or fp16)

# Optimizer configuration
optimizer:
  lr: 2.4e-4           # Learning rate
  weight_decay: 0.1     # Weight decay for regularization
  betas: [0.9, 0.999]   # Adam beta parameters
  eps: 1.0e-8          # Adam epsilon parameter

# Learning rate scheduler configuration
scheduler:
  warmup_duration: "2500ba"  # Warmup duration in batches
  max_duration: "50ep"       # Maximum training duration in epochs
  alpha_f: 0.33              # Final learning rate factor

# Trainer configuration
trainer:
  max_duration: "50ep"                    # Maximum training duration
  save_interval: "1ep"                   # How often to save checkpoints
  eval_interval: "1ep"                    # How often to run evaluation
  save_folder: "./flux_composer_checkpoints"  # Directory to save checkpoints
  run_name: "flux_training_run"           # Name for this training run
  autoresume: true                        # Whether to auto-resume from checkpoints

# Training algorithms
algorithms:
  gradient_clipping:
    clip_norm: 1.0  # Gradient clipping threshold

# Miscellaneous settings
misc:
  compile: false  # Whether to use torch.compile for optimization

# Logging configuration
logging:
  tensorboard:
    log_dir: "./my_tensorboard_logs"
    enabled: true
  wandb:
    enabled: false
    project: "flux-training"
    entity: null

# Flow matching specific parameters
flow_matching:
  sigma: 1.0           # Noise scale for flow matching
  guidance_scale: 4.0  # Guidance scale for conditional generation

# Data preprocessing parameters
data_preprocessing:
  img_latents_shape: [256, 64]      # Shape of image latents [tokens, features]
  img_ids_shape: [256, 3]           # Shape of image IDs [tokens, 3]
  txt_embeds_shape: [512, 4096]     # Shape of text embeddings [tokens, features]
  txt_ids_shape: [512, 3]          # Shape of text IDs [tokens, 3]
  vec_embeds_shape: [768]          # Shape of vector embeddings [features]

# Hardware configuration
hardware:
  device: "gpu"  # Device to use (gpu or cpu)
  pin_memory: true
  persistent_workers: true

# NCCL environment variables for distributed training
nccl:
  NCCL_NVLS_ENABLE: "0"          # Disable NVLS transport
  NCCL_TREE_THRESHOLD: "0"       # Force ring algorithms
  NCCL_NET_GDR_LEVEL: "0"        # Disable GPU Direct RDMA
  NCCL_P2P_LEVEL: "SYS"          # Enable system-level P2P
  NCCL_SHM_DISABLE: "0"          # Ensure shared memory enabled
  NCCL_ALGO: "Ring"              # Force ring algorithm
  NCCL_TIMEOUT: "1800"           # 30 minute timeout
  NCCL_DEBUG: "WARN"             # Reduce debug output

# Inference configuration for during training
inference:
  enabled: true                  # Enable inference during training
  interval: "1ep"                # Run inference every epoch
  num_steps: 50                  # Number of sampling steps for inference
  guidance_scale: 4.0            # Guidance scale for inference
  save_dir: "./inference_samples" # Directory to save inference images